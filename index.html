<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Workspace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="toolbar" role="toolbar" aria-label="Editor tools">
        <button type="button" class="tool-btn">New</button>
        <button type="button" class="tool-btn">Save</button>
        <button type="button" class="tool-btn" id="prompt-optimizer-btn">Prompt Optimizer</button>
      </header>

      <section class="editor">
        <label for="prompt-input">Prompt</label>
        <textarea id="prompt-input" placeholder="Write your prompt here..."></textarea>
      </section>

      <section class="optimizer-panel" id="optimizer-panel" aria-live="polite" hidden>
        <h2>Optimized Prompt</h2>
        <p id="optimized-output"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
